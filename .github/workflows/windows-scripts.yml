name: Windows service scripts
on:
  push:
    paths:
      - 'scripts/*windows*.ps1'
      - 'start-windows.bat'
      - 'stop-windows.bat'
      - 'install-windows-autostart.bat'
      - 'scripts/install-auto-update-task.ps1'
      - 'tests/windows-*.test.ps1'
      - 'tests/fixtures/windows-update-runner.ps1'
      - '.github/workflows/windows-scripts.yml'
  pull_request:
    paths:
      - 'scripts/*windows*.ps1'
      - 'start-windows.bat'
      - 'stop-windows.bat'
      - 'install-windows-autostart.bat'
      - 'scripts/install-auto-update-task.ps1'
      - 'tests/windows-*.test.ps1'
      - 'tests/fixtures/windows-update-runner.ps1'
      - '.github/workflows/windows-scripts.yml'
permissions:
  contents: read
jobs:
  shutdown:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test safe process shutdown with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\windows-stop.test.ps1
      - name: Test update, automatic restart and rollback
        shell: powershell
        run: .\tests\windows-update.test.ps1
      - name: Test first-upgrade startup and current-version checks
        shell: powershell
        run: .\tests\windows-start.test.ps1
      - name: Test real boot service tasks, crash recovery and update restart
        shell: powershell
        run: .\tests\windows-autostart.test.ps1
