openapi: 3.0.3
info:
  title: MSS Sample Stocking Platform API
  version: 1.0.0
  description: Contract for overview, demand collection, execution tracking and master data configuration.
servers:
  - url: http://localhost:8787/api/v1
tags:
  - name: Overview
  - name: Collection
  - name: Execution
  - name: Inventory
  - name: Integration
  - name: Configuration
security:
  - bearerAuth: []
paths:
  /integrations/stocking-demands:
    get:
      tags: [Integration]
      summary: 查询备货需求；可选维度为空时汇总全部
      description: 仅管理员及授权品类的备货接口人。先按产品型号+BOM选择最新正式反馈计划（created_at倒序，ID倒序打破同时间平局），再汇总所选组织。stage可选；不传取最新计划，传入取该阶段最新计划。没有记录返回0。代表处配额由下属国家共享；同一计划/领域/SKU/代表处一旦有国家明细（含0），以国家明细为准，未填国家为0。共享模式的国家查询返回整个代表处共享池及其累计执行量，不能把多个国家结果相加。
      parameters:
        - name: productModel
          in: query
          required: true
          description: 产品型号，与BOM同时匹配SKU
          schema: { type: string, maxLength: 256 }
        - name: bomCode
          in: query
          required: true
          description: 产品BOM编码
          schema: { type: string, maxLength: 256 }
        - name: mssDomain
          in: query
          required: false
          description: MSS领域ID、编码或名称
          schema: { type: string, maxLength: 256 }
        - name: region
          in: query
          required: false
          description: 区域ID或名称
          schema: { type: string, maxLength: 256 }
        - name: office
          in: query
          required: false
          description: 代表处ID或名称
          schema: { type: string, maxLength: 256 }
        - name: stage
          in: query
          required: false
          description: 样机阶段；空值等同不传。按计划创建时间选择最新正式批次，排除草稿与取消计划，保留已导出及归档历史。
          schema: { type: string, maxLength: 256 }
        - name: country
          in: query
          required: false
          description: 国家ID或名称
          schema: { type: string, maxLength: 256 }
      responses:
        '200':
          description: 汇总结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IntegrationDemand' }
        '401': { description: 未登录或Token过期 }
        '403': { description: 角色或产品品类无权限 }
        '422': { description: 参数缺失、主数据不匹配或组织父子关系错误 }
  /integrations/shipments:
    post:
      tags: [Integration]
      summary: 按本次发货增量同步增加累计申请与累计发货
      description: 仅管理员及授权品类的备货接口人；六个维度必须唯一，存在正式确认需求；累计申请和累计发货同时增加shippedQuantity，使用同一计划及组织维度，在同一事务提交；同账号业务流水重试不会重复累计。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 调用账号下唯一的业务流水号；同流水不同载荷返回409
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationShipmentIncrement' }
      responses:
        '200':
          description: 更新成功或返回原流水结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
                      deliveryId: { type: string }
                      replayed: { type: boolean }
                      shippedQuantityAdded: { type: integer }
        '401': { description: 未登录或Token过期 }
        '403': { description: 角色或产品品类无权限 }
        '409': { description: 业务流水号与历史载荷冲突 }
        '422': { description: 参数、数量、主数据或正式需求校验失败 }
  /meta:
    get:
      summary: Get stable role and status codes
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /overview:
    get:
      tags: [Overview]
      summary: Get operational overview read model
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Overview metrics and product rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Overview'
  /collection/plans:
    get:
      tags: [Collection]
      summary: List collection plans scoped to the current role
      parameters:
        - name: keyword
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [READY_TO_RELEASE, COLLECTING, DOMAIN_REVIEW, GTM_CLOSURE, EXPORTED, CANCELLED] }
        - name: page
          in: query
          description: When provided, data is returned as a paged object instead of the legacy array.
          schema: { type: integer, minimum: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, enum: [20, 50, 100], default: 20 }
        - name: sortBy
          in: query
          schema: { type: string, enum: [updatedAt, createdAt, deadline, demand, progress], default: updatedAt }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/RegionId'
      responses:
        '200':
          description: Collection plan list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - type: array
                            items: { $ref: '#/components/schemas/CollectionPlan' }
                          - type: object
                            required: [items, total]
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/CollectionPlan' }
                              total: { type: integer }
    post:
      tags: [Collection]
      summary: Create a GTM collection plan
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, stage, deadline]
              properties:
                productId: { type: string }
                stage: { type: string, description: Sample stage for this collection round }
                deadline: { type: string, format: date-time }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Plan created in READY_TO_RELEASE state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collection/plans/{planId}:
    get:
      tags: [Collection]
      summary: Get plan progress, summary and feedback
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Collection]
      summary: Permanently delete an unreleased plan with no domain tasks
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /collection/plans/{planId}/cancel:
    post:
      tags: [Collection]
      summary: Cancel a released plan before any regional work starts
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /collection/plans/{planId}/archive:
    post:
      tags: [Collection]
      summary: Archive a plan while retaining its complete history
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /collection/plans/{planId}/release:
    post:
      tags: [Collection]
      summary: Release a plan to every enabled MSS domain
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /collection/plans/{planId}/complete:
    post:
      tags: [Collection]
      summary: GTM completes collection early, preserving formal feedback and zero-filling unreported domains
      description: >-
        Only the owning GTM or ADMIN may complete COLLECTING/DOMAIN_REVIEW plans.
        Confirmed zero snapshots are marked GTM_ZERO_FILL; draft and submitted regional data
        are preserved but excluded from totals and exports. Pending change approvals block completion.
        The operation atomically enters GTM_CLOSURE and records an audit event.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, version]
              properties:
                confirmed: { type: boolean, enum: [true] }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /collection/domain-tasks/{taskId}/dispatch:
    post:
      tags: [Collection]
      summary: Select part or all product models and regions, then dispatch to regional owners
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productSkuIds]
              anyOf:
                - required: [organizationNodeIds]
                - required: [regionIds]
              properties:
                productSkuIds: { type: array, items: { type: string } }
                regionIds: { type: array, minItems: 1, items: { type: string }, description: 兼容旧客户端，选择区域及全部下级 }
                organizationNodeIds: { type: array, minItems: 1, items: { type: string }, description: 区域/代表处/国家ID；上级展开至末级；与regionIds同时传时优先使用此字段 }
                version: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /collection/plans/{planId}/regions/{regionId}/draft:
    put:
      tags: [Collection]
      summary: Idempotently save a regional demand draft
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RegionIdPath'
        - $ref: '#/components/parameters/RoleHeader'
        - name: domainTaskId
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandDraft'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /collection/plans/{planId}/regions/{regionId}/revisions:
    get:
      tags: [Collection]
      summary: List immutable regional submission revision snapshots
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RegionIdPath'
        - $ref: '#/components/parameters/RoleHeader'
        - name: domainTaskId
          in: query
          required: false
          description: Required when the plan and region contain more than one accessible MSS domain task.
          schema: { type: string }
      responses:
        '200':
          description: Revision history ordered from newest to oldest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DemandRevisionHistory' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collection/plans/{planId}/regions/{regionId}/submit:
    post:
      tags: [Collection]
      summary: Submit regional demand to the MSS domain owner
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RegionIdPath'
        - $ref: '#/components/parameters/RoleHeader'
        - name: domainTaskId
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /collection/domain-tasks/{taskId}/feedback:
    post:
      tags: [Collection]
      summary: Formally hand the domain summary back to GTM
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, note]
              properties:
                confirmed: { type: boolean, enum: [true] }
                note: { type: string, minLength: 1, maxLength: 1000 }
                version: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /collection/plans/{planId}/regions/{regionId}/return:
    post:
      tags: [Collection]
      summary: Return a submitted regional snapshot for correction
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RegionIdPath'
        - name: domainTaskId
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
                version: { type: integer }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /collection/plans/{planId}/export:
    post:
      tags: [Collection]
      summary: Generate a production-planning export snapshot
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '409': { $ref: '#/components/responses/Conflict' }
  /execution/imports:
    get:
      tags: [Execution]
      summary: List the current stocking owner's recent TSMP import jobs
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Execution]
      summary: Create a TSMP shipment import job
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              properties:
                fileName: { type: string }
                rows:
                  type: array
                  description: Local starter accepts parsed rows; production accepts a controlled upload reference.
                  items:
                    $ref: '#/components/schemas/TsmpShipmentRow'
      responses:
        '202': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /shipment-approval/check:
    post:
      tags: [Execution]
      summary: Check a TSMP application against confirmed demand and inventory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentApprovalCheck'
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /execution:
    get:
      tags: [Execution]
      summary: Get product-first cumulative execution tracking
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/RegionId'
        - name: officeId
          in: query
          schema: { type: string }
        - name: country
          in: query
          schema: { type: string }
        - name: keyword
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Metrics and product rows with nested SKUs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExecutionView' }
  /inventory:
    get:
      tags: [Inventory]
      summary: List inventory balances and difference metrics
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: keyword
          in: query
          schema: { type: string }
        - name: onlyDiff
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /inventory/{inventoryId}/check:
    put:
      tags: [Inventory]
      summary: Confirm actual inventory and close a difference
      parameters:
        - name: inventoryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actualQuantity, reason, version]
              properties:
                actualQuantity: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 512 }
                version: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /config/catalog:
    get:
      tags: [Configuration]
      summary: Get domains, products and organization tree
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /config/products:
    post:
      tags: [Configuration]
      summary: Create a product; SKU and BOM are optional
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /config/products/{productId}:
    put:
      tags: [Configuration]
      summary: Update product configuration
      parameters:
        - $ref: '#/components/parameters/ProductIdPath'
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
        '404': { $ref: '#/components/responses/NotFound' }
  /config/domains:
    post:
      tags: [Configuration]
      summary: Create a product domain responsibility record
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /config/domains/{domainId}:
    put:
      tags: [Configuration]
      summary: Update domain and inherited owners
      parameters:
        - name: domainId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DomainInput' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
  /config/organizations:
    post:
      tags: [Configuration]
      summary: Create a region with representative offices
      parameters:
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '201': { $ref: '#/components/responses/Success' }
  /config/organizations/{regionId}:
    put:
      tags: [Configuration]
      summary: Update a region tree
      parameters:
        - $ref: '#/components/parameters/RegionIdPath'
        - $ref: '#/components/parameters/RoleHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationInput' }
      responses:
        '200': { $ref: '#/components/responses/Success' }
    delete:
      tags: [Configuration]
      summary: Delete an unused region or disable a historically referenced region tree
      parameters:
        - $ref: '#/components/parameters/RegionIdPath'
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200': { $ref: '#/components/responses/Success' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RoleHeader:
      name: Authorization
      in: header
      required: true
      description: JWT bearer token. Retained as a reusable parameter for existing operation entries.
      schema: { type: string, example: 'Bearer eyJ...' }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string }
    ProductId:
      name: productId
      in: query
      schema: { type: string, default: all }
    ProductIdPath:
      name: productId
      in: path
      required: true
      schema: { type: string }
    RegionId:
      name: regionId
      in: query
      schema: { type: string }
    RegionIdPath:
      name: regionId
      in: path
      required: true
      schema: { type: string }
  responses:
    Success:
      description: Successful response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Forbidden:
      description: Role or scope denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State or version conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    IntegrationShipmentIncrement:
      type: object
      additionalProperties: false
      required: [productModel, bomCode, mssDomain, region, office, country, shippedQuantity]
      properties:
        productModel: { type: string, minLength: 1, maxLength: 256, description: 产品型号，与BOM同时匹配SKU }
        bomCode: { type: string, minLength: 1, maxLength: 256, description: 产品BOM编码 }
        mssDomain: { type: string, minLength: 1, maxLength: 256, description: MSS领域ID、编码或名称 }
        region: { type: string, minLength: 1, maxLength: 256, description: 区域ID或名称 }
        office: { type: string, minLength: 1, maxLength: 256, description: 代表处ID或名称 }
        country: { type: string, minLength: 1, maxLength: 256, description: 国家ID或名称 }
        stage: { type: string, maxLength: 256, description: 可选；绑定该阶段最新正式计划，不传绑定最新正式计划 }
        shippedQuantity: { type: integer, minimum: 1, maximum: 2147483647, description: 本次新增发货数量，同时增加等量累计申请，必须为正整数 }
    IntegrationDemand:
      type: object
      properties:
        productModel: { type: string }
        bomCode: { type: string }
        filters: { type: object, additionalProperties: { type: string, nullable: true } }
        planId: { type: string, nullable: true, description: 本次取数的正式收集计划 }
        planNo: { type: string, nullable: true }
        stage: { type: string, nullable: true }
        quotaMode: { type: string, enum: [AGGREGATE, OFFICE_SHARED, COUNTRY, MIXED], description: 共享池模式的国家结果不能相加；领域混合时为MIXED }
        demandQuantity: { type: integer, description: 正式确认的申请需求数量 }
        appliedQuantity: { type: integer, description: 已申请数量 }
        shippedQuantity: { type: integer, description: 累计发货数量 }
        remainingToApply: { type: integer, description: 确认需求减已申请数量；下限0 }
        officeUnallocatedDemandQuantity: { type: integer, description: 国家查询涉及的代表处共享需求，已计入主指标，仅供识别共享池 }
        officeUnallocatedAppliedQuantity: { type: integer, description: 国家查询涉及的共享池累计申请，已计入主指标，仅供核对 }
    Envelope:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string, example: OK }
        message: { type: string, example: success }
        data: {}
        requestId: { type: string }
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            details:
              type: array
              items: { type: string }
    PlanStatus:
      type: string
      enum: [PRODUCT_DRAFT, READY_TO_RELEASE, COLLECTING, DOMAIN_REVIEW, GTM_CLOSURE, EXPORTED]
    CollectionPlan:
      type: object
      required: [id, viewId, productId, stage, selectedSkuIds, submittedRegions, domainTasks, status, deadline, version]
      properties:
        id: { type: string }
        viewId: { type: string, description: Parent plan id for GTM or domain task id for MSS/regional views }
        productId: { type: string }
        domainTaskId: { type: string }
        completedEarly: { type: boolean, description: At least one visible domain has a GTM zero-fill completion snapshot }
        zeroFilled: { type: boolean, description: The active domain task was completed by GTM at zero; original drafts/history remain read-only }
        stage: { type: string }
        selectedSkuIds: { type: array, items: { type: string } }
        submittedRegions: { type: array, items: { type: string } }
        domainTasks:
          type: array
          items:
            type: object
            properties:
              zeroFilled: { type: boolean, description: Display as completed at zero, never as formal domain feedback }
        status: { $ref: '#/components/schemas/PlanStatus' }
        deadline: { type: string, format: date-time }
        demandTotal: { type: integer, minimum: 0 }
        note: { type: string }
        version: { type: integer, minimum: 1 }
    DemandDraft:
      type: object
      required: [items]
      properties:
        version: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [productItemKey, officeId, quantity]
            properties:
              productItemKey: { type: string, description: SKU id or product-level provisional key }
              officeId: { type: string, description: 当前下发范围内代表处ID }
              countryId: { type: string, nullable: true, description: 可选的下发范围内国家ID；不传为代表处共享配额；显式0触发国家明细口径，空输入不保存国家行 }
              quantity: { type: integer, minimum: 0 }
              basis: { type: string }
              plannedUseDate: { type: string, format: date }
              note: { type: string, maxLength: 500 }
    DemandRevisionHistory:
      type: object
      required: [planId, domainTaskId, regionId, regionName, mssDomainName, currentRevisionNo, revisions]
      properties:
        planId: { type: string }
        domainTaskId: { type: string }
        regionId: { type: string }
        regionName: { type: string }
        mssDomainName: { type: string }
        currentRevisionNo: { type: integer, minimum: 0 }
        revisions:
          type: array
          description: Immutable formal submission snapshots, newest first.
          items:
            type: object
            required: [id, revisionNo, submittedBy, submittedAt, totalQuantity, items]
            properties:
              id: { type: string }
              revisionNo: { type: integer, minimum: 1 }
              submittedBy: { type: string }
              submittedAt: { type: string, format: date-time }
              changeRequestId: { type: string }
              totalQuantity: { type: integer, minimum: 0 }
              items:
                type: array
                items:
                  type: object
                  properties:
                    productItemKey: { type: string }
                    skuModel: { type: string }
                    bomCode: { type: string }
                    officeId: { type: string }
                    officeName: { type: string }
                    quantity: { type: integer, minimum: 0 }
                    basis: { type: string }
                    plannedUseDate: { type: string, format: date }
                    note: { type: string }
    ProductInput:
      type: object
      required: [name, domainId]
      properties:
        name: { type: string, minLength: 1 }
        domainId: { type: string }
        supplyTimeText: { type: string }
        defaultDeadline: { type: string }
        enabled: { type: boolean, default: true }
        skus:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              model: { type: string }
              bomCode: { type: string }
              description: { type: string }
    DomainInput:
      type: object
      required: [name, gtmOwner, stockingOwner]
      properties:
        name: { type: string }
        description: { type: string }
        gtmOwner: { type: string }
        stockingOwner: { type: string }
        enabled: { type: boolean, default: true }
    OrganizationInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        owner: { type: string, description: 区域接口人姓名或工号；创建区域时可暂不填写，后续通过用户范围分配自动回填 }
        enabled: { type: boolean, default: true }
        offices:
          type: array
          items:
            type: object
            required: [name]
            properties:
              id: { type: string }
              name: { type: string }
              owner: { type: string, description: 代表处接口人姓名或工号；创建代表处时可暂不填写，后续通过用户范围分配自动回填 }
              enabled: { type: boolean, default: true }
              countries: { type: array, items: { type: string } }
    TsmpShipmentRow:
      type: object
      required: [mssDomain, bomCode, region, office, country, shippedQty]
      properties:
        externalKey: { type: string }
        applicationNo: { type: string }
        mssDomain: { type: string, description: TSMP“业务领域”，匹配平台MSS领域名称或编码 }
        sku: { type: string }
        bomCode: { type: string, description: TSMP“BOM编码”，匹配产品BOM编码 }
        region: { type: string, description: TSMP“地区部”，匹配平台区域 }
        office: { type: string, description: TSMP“代表处” }
        country: { type: string, description: TSMP“国家/地区”，匹配平台国家 }
        shippedQty: { type: integer, minimum: 1, description: TSMP“发货数量”，写入实际发货数量 }
        shippedAt: { type: string, format: date-time }
    ShipmentApprovalCheck:
      type: object
      required: [applicationNo, applicant, sku, region, office, requestedQuantity]
      properties:
        applicationNo: { type: string }
        applicant: { type: string }
        sku: { type: string, description: SKU id, model, or BOM code }
        region: { type: string, description: Region id or name }
        office: { type: string, description: Office id or name }
        requestedQuantity: { type: integer, minimum: 1 }
    ExecutionSku:
      type: object
      properties:
        sku: { type: string }
        bom: { type: string }
        demand: { type: integer }
        applied: { type: integer }
        shipped: { type: integer }
        inventory: { type: integer }
        shipmentCount: { type: integer }
    ExecutionView:
      type: object
      properties:
        scopeLabel: { type: string }
        metrics: { type: object, additionalProperties: { type: integer } }
        products:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              domain: { type: string }
              gtm: { type: string }
              stockingOwner: { type: string }
              metrics: { type: object, additionalProperties: { type: integer } }
              skus:
                type: array
                items: { $ref: '#/components/schemas/ExecutionSku' }
        rows:
          type: array
          description: 产品、SKU、MSS领域和区域组织融合后的执行明细
          items:
            type: object
            properties:
              key: { type: string }
              productId: { type: string }
              productName: { type: string }
              skuId: { type: string }
              sku: { type: string }
              bom: { type: string }
              mssDomain: { type: string }
              region: { type: string }
              office: { type: string }
              country: { type: string }
              demand: { type: integer }
              applied: { type: integer }
              shipped: { type: integer }
              inventory: { type: integer }
              shipmentCount: { type: integer }
    Overview:
      type: object
      properties:
        productId: { type: string }
        metrics: { type: object, additionalProperties: { type: number } }
        process: { type: array, items: { type: object } }
        rows: { type: array, items: { type: object } }
        attention: { type: array, items: { type: object } }
